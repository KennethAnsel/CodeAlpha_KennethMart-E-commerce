<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Kenneth Mart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
 
<div id="notification" class="notification hidden"></div>
 
<nav class="navbar">
  <a class="nav-logo" href="index.html">Kenneth<span class="dot">.</span>Mart</a>
  <div class="nav-right">
    <a href="login.html"  class="nav-link">Login</a>
    <a href="index.html"  class="nav-link">← Store</a>
  </div>
</nav>
 
<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Create account</h1>
    <p class="auth-sub">Join Kenneth Mart — it's free</p>
 
    <div id="form-error" class="form-err"></div>
 
    <form id="register-form" autocomplete="on">
      <div class="form-group">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name"
               placeholder="Your full name" required autocomplete="name">
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email"
               placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="At least 6 characters" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" name="confirm"
               placeholder="Repeat your password" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:0.75rem">
        Create account →
      </button>
    </form>
 
    <div class="auth-divider">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>
</div>
 
<script src="app.js"></script>
<script>initRegister();</script>
</body>
</html>
